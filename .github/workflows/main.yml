name: Build X4C_SoundTouch APK - 1 Click

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Build APK
        run: |
          cd app
          chmod +x ../gradlew 2>/dev/null || gradle wrapper --gradle-version 8.5
          ./gradlew assembleDebug --stacktrace || gradle assembleDebug
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: X4C_SoundTouch-APK
          path: app/build/outputs/apk/debug/app-debug.apk
